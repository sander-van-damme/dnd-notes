name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: QAT Mobile contract, integrity and offline cache tests
        run: npx vitest run src/model/catalog.test.ts src/model/install.test.ts src/model/integrity.test.ts
      - name: Complete unit and integration suite
        run: npm test
      - run: npm run build
      - run: npm run build:cloudflare
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions (QAT selection, safe legacy cleanup and app flows)
        run: CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") npm run test:e2e
